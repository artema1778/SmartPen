name: Build SmartPen IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build app
        run: |
          xcodebuild \
            -project SmartPen.xcodeproj \
            -scheme SmartPen \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SmartPen.app Payload/
          zip -r SmartPen.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SmartPen-IPA
          path: SmartPen.ipa
